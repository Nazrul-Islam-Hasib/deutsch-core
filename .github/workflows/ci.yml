# Continuous integration: test, lint and build both apps.
# Runs on every pull request and on pushes to main (i.e. after a merge).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway Postgres for the tests (they hit a real database, no mocks).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: deutsch_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d deutsch_core_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Test-only values, not secrets: the database and JWTs exist only inside this job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/deutsch_core_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/deutsch_core_test
      JWT_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci # postinstall runs `prisma generate`

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  frontend:
    name: Frontend (lint + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run # `npm test` would start watch mode

      - name: Build
        run: npm run build
