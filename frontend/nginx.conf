# Rendered by envsubst at container start: ${BACKEND_HOST} and ${BACKEND_PORT}
# are replaced; nginx's own $variables are left alone.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Liveness probe for the container itself (does not touch the backend)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/words -> http://backend:3000/words  (the backend has no /api prefix;
    # the trailing slash on proxy_pass strips it)
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Vite fingerprints files in /assets, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for React Router (same idea as the Firebase rewrite)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
